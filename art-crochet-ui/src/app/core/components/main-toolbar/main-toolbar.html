<header class="top-banner" aria-label="Xima logo banner">
  <div class="top-banner__semicircle" role="img" aria-label="Top half of Xima logo"></div>
</header>

<mat-toolbar>
  <div class="toolbar-title-samples" aria-label="Toolbar title font comparison">
    <span class="toolbar-title toolbar-title--montez">{{ title }}</span>
    <!-- <span class="toolbar-title toolbar-title--italianno">{{ title }}</span>
    <span class="toolbar-title toolbar-title--short-stack">{{ title }}</span>
    <span class="toolbar-title toolbar-title--crafty-girls">{{ title }}</span> -->
  </div>

  <button
    mat-icon-button
    class="toolbar-theme-toggle"
    [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    [matTooltip]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    (click)="themeService.toggle()"
  >
    @if (themeService.isDark()) {
      <mat-icon>light_mode</mat-icon>
    } @else {
      <mat-icon>dark_mode</mat-icon>
    }
  </button>
</mat-toolbar>
