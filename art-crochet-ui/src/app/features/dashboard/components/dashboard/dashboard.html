<section class="dashboard">
	<h1 class="dashboard__title">Latest Instagram Pictures</h1>

	@if (isLoading()) {
		<p class="dashboard__state">Loading pictures...</p>
	} @else if (errorMessage()) {
		<p class="dashboard__state dashboard__state--error">{{ errorMessage() }}</p>
	} @else if (pictures().length === 0) {
		<p class="dashboard__state">No pictures available yet.</p>
	} @else {
		<div class="pictures-grid">
			@for (picture of pictures(); track picture.permalink) {
				<a
					class="picture-card"
					[href]="picture.permalink"
					target="_blank"
					rel="noopener noreferrer"
					[attr.aria-label]="'Open Instagram post: ' + (picture.caption || 'Picture')"
				>
					<img
						class="picture-card__image"
						[src]="picture.picture_url"
						[alt]="picture.caption || 'Instagram picture'"
						loading="lazy"
					/>
				</a>
			}
		</div>
	}
</section>
