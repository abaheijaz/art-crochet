<h2 mat-dialog-title class="dialog__title">What would you like to do?</h2>

<mat-dialog-actions class="dialog__actions" align="center">
  <button mat-button (click)="choose('instagram')" aria-label="Open this picture on Instagram">
    View Instagram
  </button>
  <button
    mat-flat-button
    (click)="choose('product-detail')"
    aria-label="Go to product details page"
  >
    View Details
  </button>
</mat-dialog-actions>
